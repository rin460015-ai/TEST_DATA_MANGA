<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book Wishlist Survey</title>
<meta name="description" content="Tell us your language and the books you want to read.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1e9; --card:#fffdf9; --ink:#22201c; --muted:#6b645a;
    --line:#e3dacb; --accent:#b4462b; --accent-ink:#fff; --focus:#e9a23b;
    --ok:#2f6b46; --err:#a8321e;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#191714; --card:#221f1b; --ink:#f1ebe1; --muted:#a69d90;
      --line:#3a352e; --accent:#e0714f; --accent-ink:#1a1714; --focus:#f0b65a;
      --ok:#7cc79a; --err:#f08a72; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans CJK SC","Noto Sans KR",sans-serif;}
  .wrap{max-width:640px;margin:0 auto;padding:24px 16px 64px}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px}
  .brand{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:18px;letter-spacing:.2px}
  .brand span{color:var(--accent)}
  select,input,textarea{font:inherit;color:inherit}
  .langsel{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
  h1{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:clamp(28px,6vw,40px);line-height:1.15;margin:0 0 12px}
  .lead{color:var(--muted);margin:0 0 28px}
  form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
  fieldset{border:0;padding:0;margin:0 0 24px}
  legend,label.q{display:block;font-weight:600;margin-bottom:8px}
  .hint{color:var(--muted);font-size:14px;font-weight:400}
  .field{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .field:focus,.langsel:focus,button:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip input{position:absolute;opacity:0;pointer-events:none}
  .chip span{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);cursor:pointer;font-size:15px}
  .chip input:checked + span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .chip input:focus-visible + span{outline:3px solid var(--focus)}
  .book{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px}
  @media (max-width:520px){.book{grid-template-columns:1fr auto}.book .author{grid-column:1}}
  .icon-btn{border:1px solid var(--line);background:transparent;border-radius:10px;width:42px;cursor:pointer;color:var(--muted);font-size:18px}
  .link-btn{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0}
  .ref{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:15px}
  .ref-title{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
  .ref-row{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
  .ref-row b{white-space:nowrap}
  .ref-note{font-size:12px;color:var(--muted);margin-top:6px}
  .consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted)}
  .consent input{margin-top:4px}
  .submit{width:100%;border:0;border-radius:12px;padding:14px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;cursor:pointer}
  .submit[disabled]{opacity:.6;cursor:wait}
  .msg{margin-top:14px;font-size:15px}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--err)}
  .hp{position:absolute;left:-9999px}
  .thanks{text-align:center;padding:40px 16px}
  .thanks h2{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:30px;margin:0 0 8px}
  footer{margin-top:24px;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Book<span>·</span>Wish</div>
    <select id="uiLang" class="langsel" aria-label="Language"></select>
  </header>

  <main id="main">
    <h1 data-i18n="title"></h1>
    <p class="lead" data-i18n="lead"></p>

    <form id="form" novalidate>
      <fieldset>
        <label class="q" for="nativeLang" data-i18n="qNative"></label>
        <select id="nativeLang" class="field" required></select>
        <input id="nativeOther" class="field" style="display:none;margin-top:8px" maxlength="60">
      </fieldset>

      <fieldset>
        <legend><span data-i18n="qRead"></span> <span class="hint" data-i18n="multi"></span></legend>
        <div class="chips" id="readLangs"></div>
      </fieldset>

      <fieldset>
        <label class="q" for="country"><span data-i18n="qCountry"></span> <span class="hint" data-i18n="optional"></span></label>
        <input id="country" class="field" maxlength="60" autocomplete="country-name">
      </fieldset>

      <fieldset>
        <legend><span data-i18n="qBooks"></span> <span class="hint" data-i18n="booksHint"></span></legend>
        <div id="books"></div>
        <button type="button" class="link-btn" id="addBook" data-i18n="addBook"></button>
      </fieldset>

      <fieldset>
        <legend><span data-i18n="qPrice"></span> <span class="hint" data-i18n="optional"></span></legend>
        <div class="ref">
          <div class="ref-title" data-i18n="refTitle"></div>
          <div class="ref-row"><span data-i18n="refManga"></span><b id="refP1"></b></div>
          <div class="ref-row"><span data-i18n="refHard"></span><b id="refP2"></b></div>
          <div class="ref-note" id="fxNote" data-i18n="fxNote" hidden></div>
        </div>
        <div class="chips" id="priceOpts"></div>
      </fieldset>

      <fieldset>
        <label class="q" for="comment"><span data-i18n="qComment"></span> <span class="hint" data-i18n="optional"></span></label>
        <textarea id="comment" class="field" rows="3" maxlength="1000"></textarea>
      </fieldset>

      <input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">

      <fieldset>
        <label class="consent"><input type="checkbox" id="consent" required><span data-i18n="consent"></span></label>
      </fieldset>

      <button class="submit" id="submit" type="submit" data-i18n="submit"></button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </form>
  </main>

  <footer data-i18n="footer"></footer>
</div>

const UI_LANGS = [["en","English"],["zh-Hans","简体中文"],["zh-Hant","繁體中文"],["ko","한국어"],["es","Español"],["pt","Português"],["fr","Français"],["ja","日本語"]];

/* ============ 動作 ============ */
const $ = id => document.getElementById(id);
let ui = detectLang();

function detectLang(){
  try{ const s = localStorage.getItem("uiLang"); if (s && T[s]) return s; }catch(e){}
  const n = (navigator.language||"en").toLowerCase();
  if (n.startsWith("zh")) return /tw|hk|mo|hant/.test(n) ? "zh-Hant" : "zh-Hans";
  const base = n.split("-")[0];
  return T[base] ? base : "en";
}
const t = k => (T[ui] && T[ui][k]) || T.en[k];

function render(){
  document.documentElement.lang = ui;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  $("nativeOther").placeholder = t("otherLang");
  const nl = $("nativeLang"), keep = nl.value;
  nl.innerHTML = ""; nl.append(new Option(t("choose"), ""));
  LANGS.forEach(([c,n]) => nl.append(new Option(c==="other" ? t("otherOpt") : n, c)));
  nl.value = keep;
  document.querySelectorAll(".book").forEach(row => {
    row.querySelector(".title").placeholder = t("title_ph");
    row.querySelector(".author").placeholder = t("author_ph");
    row.querySelector(".icon-btn").setAttribute("aria-label", t("remove"));
  });
  renderPrices();
  if ($("againBtn")) { $("againBtn").textContent = t("again"); }
}

function buildStatic(){
  const sel = $("uiLang");
  UI_LANGS.forEach(([c,n]) => sel.append(new Option(n, c)));
  sel.value = ui;
  sel.onchange = () => { ui = sel.value; try{localStorage.setItem("uiLang", ui);}catch(e){} render(); };

  const box = $("readLangs");
  LANGS.filter(l => l[0] !== "other").forEach(([c,n]) => {
    const lab = document.createElement("label"); lab.className = "chip";
    lab.innerHTML = `<input type="checkbox" value="${c}"><span></span>`;
    lab.querySelector("span").textContent = n;
    box.append(lab);
  });
  $("nativeLang").onchange = e => {
    $("nativeOther").style.display = e.target.value === "other" ? "block" : "none";
    // 第一言語は「読める言語」にも自動でチェック
    const cb = box.querySelector(`input[value="${e.target.value}"]`);
    if (cb) cb.checked = true;
  };
  $("addBook").onclick = () => addBook(true);
  addBook(); addBook();
}

function addBook(focus){
  const list = $("books");
  if (list.children.length >= MAX_BOOKS) return;
  const row = document.createElement("div"); row.className = "book";
  row.innerHTML = `<input class="field title" maxlength="200"><input class="field author" maxlength="120"><button type="button" class="icon-btn">×</button>`;
  row.querySelector(".icon-btn").onclick = () => { if (list.children.length > 1) row.remove(); else { row.querySelectorAll("input").forEach(i=>i.value=""); } };
  list.append(row); render();
  if (focus) row.querySelector(".title").focus();
  $("addBook").style.display = list.children.length >= MAX_BOOKS ? "none" : "";
}

/* ===== 価格表示（円＋閲覧者の地域通貨の目安） ===== */
let fx = null; // {cur, rate}  1円あたりの現地通貨
const REGION_CUR = {US:"USD",CA:"CAD",GB:"GBP",AU:"AUD",NZ:"NZD",KR:"KRW",CN:"CNY",TW:"TWD",HK:"HKD",SG:"SGD",
  TH:"THB",VN:"VND",ID:"IDR",PH:"PHP",MY:"MYR",IN:"INR",BR:"BRL",MX:"MXN",AR:"ARS",CL:"CLP",CO:"COP",PE:"PEN",
  CH:"CHF",SE:"SEK",NO:"NOK",DK:"DKK",PL:"PLN",TR:"TRY",RU:"RUB",SA:"SAR",AE:"AED",EG:"EGP",ZA:"ZAR",
  DE:"EUR",FR:"EUR",ES:"EUR",IT:"EUR",PT:"EUR",NL:"EUR",BE:"EUR",AT:"EUR",IE:"EUR",FI:"EUR",GR:"EUR"};
function guessCurrency(){
  for (const l of (navigator.languages || [navigator.language || ""])){
    const m = /[-_]([A-Za-z]{2})\b/.exec(l); if (m && REGION_CUR[m[1].toUpperCase()]) return REGION_CUR[m[1].toUpperCase()];
  }
  return "USD";
}
async function loadFx(){
  const cur = guessCurrency();
  try{
    const r = await fetch("https://open.er-api.com/v6/latest/JPY"); const j = await r.json();
    if (j && j.rates && j.rates[cur]) { fx = {cur, rate:j.rates[cur]}; renderPrices(); }
  }catch(e){ /* 取得できなければ円のみ表示 */ }
}
function yen(n){
  let s = "¥" + n.toLocaleString("en-US");
  if (fx) {
    const v = n * fx.rate;
    const f = new Intl.NumberFormat(ui, {style:"currency", currency:fx.cur, maximumFractionDigits: v >= 100 ? 0 : 2});
    s += " (≈ " + f.format(v) + ")";
  }
  return s;
}
function renderPrices(){
  $("refP1").textContent = yen(REF_MANGA);
  $("refP2").textContent = yen(REF_HARD);
  $("fxNote").hidden = !fx;
  const box = $("priceOpts"), keep = (box.querySelector("input:checked")||{}).value;
  box.innerHTML = "";
  PRICE_OPTS.forEach(([v,k,n]) => {
    const lab = document.createElement("label"); lab.className = "chip";
    lab.innerHTML = `<input type="radio" name="price" value="${v}"><span></span>`;
    lab.querySelector("span").textContent = n == null ? t(k) : t(k).replace("{p}", yen(n));
    if (v === keep) lab.querySelector("input").checked = true;
    box.append(lab);
  });
}

function showMsg(text, kind){ const m = $("msg"); m.textContent = text; m.className = "msg " + (kind||""); }

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const native = $("nativeLang").value;
  const reading = [...document.querySelectorAll("#readLangs input:checked")].map(i => i.value);
  const books = [...document.querySelectorAll(".book")]
    .map(r => ({title:r.querySelector(".title").value.trim(), author:r.querySelector(".author").value.trim()}))
    .filter(b => b.title);
  if (!native) return showMsg(t("errNative"), "err");
  if (!reading.length) return showMsg(t("errRead"), "err");
  if (!books.length) return showMsg(t("errBook"), "err");
  if (!$("consent").checked) return showMsg(t("errConsent"), "err");

  const payload = {
    nativeLang: native === "other" ? "other:" + $("nativeOther").value.trim() : native,
    readingLangs: reading,
    country: $("country").value.trim(),
    books,
    price: (document.querySelector("#priceOpts input:checked")||{}).value || "",
    priceShown: fx ? fx.cur : "JPY",
    comment: $("comment").value.trim(),
    uiLang: ui,
    browserLang: navigator.language || "",
    website: $("website").value   // スパム対策（人間には見えない欄）
  };

  const btn = $("submit"); btn.disabled = true; btn.textContent = t("sending"); showMsg("");
  try{
    if (ENDPOINT.startsWith("PASTE_")) throw new Error("ENDPOINT not set");
    await fetch(ENDPOINT, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(payload) });
    $("main").innerHTML = `<div class="thanks"><h2 data-i18n="ok"></h2><p class="lead" data-i18n="okBody"></p><button class="submit" id="againBtn" style="max-width:260px"></button></div>`;
    render();
    $("againBtn").onclick = () => location.reload();
  }catch(err){
    console.error(err);
    showMsg(t("errSend"), "err");
    btn.disabled = false; btn.textContent = t("submit");
  }
});

buildStatic(); render(); loadFx();
</script>
